[project]
name = "graphrag-pipeline-pydantic-ai"
version = "0.1.0"
description = "LLM-based knowledge graph ingestion and retrieval pipeline over Neo4j, built on pydantic-ai."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.0",
    "graphdatascience==1.21",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=0.4",
    "openai>=1.50",
    "httpx2",
    "tiktoken>=0.7",
    "PyMuPDF==1.27.2",
    "unstructured[all-docs]==0.22.31",
    "wikipedia==1.4.0",
    "beautifulsoup4>=4.12",
    "requests>=2.20.0",
    "chardet==5.2.0",
    "python-dotenv==1.2.2",
    "pandas",
    "tree-sitter",
    "tree-sitter-python",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "deepeval",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
